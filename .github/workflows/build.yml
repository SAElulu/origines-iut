name: Compiler le mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: origines-iut-jar
          path: build/libs/origines-iut-*.jar
